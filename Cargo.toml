[package]
name = "rust-to-mojo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "An honest, report-driven Rust to Mojo source translator"
repository = "https://github.com/lee101/rust-to-mojo"
readme = "README.md"
keywords = ["mojo", "transpiler", "rust", "translation"]

[[bin]]
name = "rust-to-mojo"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits", "printing", "parsing"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
